[project]
name = "jobhunter"
version = "0.1.0"
description = "Local job-search assistant for the German market, driven by Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "python-jobspy>=1.1.80",
    "mcp>=1.10",
    "typst>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
